<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>图片助手 v5</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f1f5f9;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #94a3b8;
            --radius: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px 15px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--card);
            width: 100%;
            max-width: 520px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        }

        /* ── 路径设置区 ── */
        .path-section {
            background: var(--primary-light);
            border: 1px solid #bfdbfe;
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 14px;
        }

        .path-section .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        .path-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-group label {
            font-size: 11px;
            color: #475569;
            font-weight: 500;
        }

        .field-group input {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            color: var(--text);
            background: white;
            transition: border-color 0.2s;
        }

        .field-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .path-preview {
            margin-top: 8px;
            font-size: 11px;
            color: #64748b;
            background: white;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            padding: 7px 10px;
            font-family: monospace;
            word-break: break-all;
        }

        .path-preview span { color: var(--primary); font-weight: 600; }

        .path-tip {
            margin-top: 6px;
            font-size: 10px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* ── 输入区 ── */
        textarea {
            width: 100%;
            height: 100px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
            color: var(--text);
            transition: border-color 0.2s;
        }
        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        /* ── 按钮 ── */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 10px;
            margin: 12px 0;
        }

        button {
            padding: 11px;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            color: white;
            font-family: inherit;
            transition: opacity 0.15s, transform 0.1s;
        }
        button:active { transform: scale(0.97); }

        .btn-preview  { background: #475569; }
        .btn-download { background: var(--primary); }
        button:hover  { opacity: 0.88; }

        /* ── 图片列表 ── */
        #result-list { margin-top: 14px; }

        .item {
            display: flex;
            align-items: center;
            background: #f8fafc;
            padding: 10px;
            border-radius: var(--radius);
            margin-bottom: 8px;
            border: 1px solid var(--border);
            gap: 12px;
        }

        .item img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 6px;
            background: #e2e8f0;
            flex-shrink: 0;
        }

        .item-info {
            flex: 1;
            overflow: hidden;
        }

        .item-info .img-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .item-info .img-path {
            font-size: 10px;
            color: #64748b;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .item-info .img-url {
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .dl-link {
            background: var(--success);
            color: white;
            padding: 7px 13px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
            transition: opacity 0.15s;
        }
        .dl-link:hover { opacity: 0.85; }

        /* ── 日志 ── */
        #log {
            font-size: 11px;
            color: var(--muted);
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            max-height: 80px;
            overflow-y: auto;
            line-height: 1.7;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📦 图片批量助手</h2>

    <!-- 自定义保存路径 -->
    <div class="path-section">
        <div class="section-title">📁 自定义保存路径</div>
        <div class="path-row">
            <div class="field-group">
                <label>子文件夹名称（相对于浏览器默认下载目录）</label>
                <input type="text" id="save-folder" placeholder="例如：wallpapers 或 2025/travel" oninput="updatePreview()">
            </div>
            <div class="field-group">
                <label>文件名前缀</label>
                <input type="text" id="save-prefix" placeholder="例如：photo 或 img_batch" oninput="updatePreview()">
            </div>
        </div>
        <div class="path-preview" id="path-preview">
            ⬇ 下载到：<span>Downloads/</span>photo_001.jpg
        </div>
        <div class="path-tip">
            💡 子文件夹支持多级，如 <code>旅行/2025</code>，Chrome / Edge 会自动在下载目录内创建。<br>
            ⚠️ Safari 和部分手机浏览器不支持子文件夹，将直接保存到下载根目录。
        </div>
    </div>

    <!-- 链接输入 -->
    <textarea id="input" placeholder="请在此粘贴图片链接，每行一条..."></textarea>

    <div class="btn-group">
        <button class="btn-preview"  onclick="processLinks()">解析并预览</button>
        <button class="btn-download" onclick="batchDownload()">一键尝试下载</button>
    </div>

    <div id="result-list"></div>
    <div id="log"></div>
</div>

<script>
    const input      = document.getElementById('input');
    const resultList = document.getElementById('result-list');
    const logArea    = document.getElementById('log');

    function log(msg) {
        logArea.innerHTML = `<span style="color:#64748b">[${new Date().toLocaleTimeString()}]</span> ${msg}<br>` + logArea.innerHTML;
    }

    /* ── 路径预览 ── */
    function updatePreview() {
        const folder = document.getElementById('save-folder').value.trim().replace(/^\/|\/$/g, '');
        const prefix = document.getElementById('save-prefix').value.trim() || 'IMG';
        const folderPart = folder ? `${folder}/` : '';
        document.getElementById('path-preview').innerHTML =
            `⬇ 下载到：<span>Downloads/${folderPart}</span>${prefix}_001.jpg`;
    }

    /* ── 构建文件名 ── */
    function buildFileName(index) {
        const folder = document.getElementById('save-folder').value.trim().replace(/^\/|\/$/g, '');
        const prefix = document.getElementById('save-prefix').value.trim() || 'IMG';
        const num    = String(index + 1).padStart(3, '0');
        const name   = `${prefix}_${num}.jpg`;
        return folder ? `${folder}/${name}` : name;
    }

    /* ── 解析并展示 ── */
    function processLinks() {
        resultList.innerHTML = '';
        const urls = input.value.split('\n').map(u => u.trim()).filter(u => u.length > 10);
        if (urls.length === 0) return alert('请输入有效链接');

        urls.forEach((url, index) => {
            const fileName    = buildFileName(index);
            const displayName = fileName.split('/').pop();
            const dirPart     = fileName.includes('/') ? fileName.substring(0, fileName.lastIndexOf('/') + 1) : '';

            const html = `
                <div class="item">
                    <img src="${url}" referrerpolicy="no-referrer"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%2256%22><rect width=%2256%22 height=%2256%22 fill=%22%23e2e8f0%22/><text x=%2250%%22 y=%2255%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%228%22 fill=%22%2394a3b8%22>预览受限</text></svg>'">
                    <div class="item-info">
                        <div class="img-label">图片 ${index + 1}</div>
                        <div class="img-path">📁 ${dirPart}<strong>${displayName}</strong></div>
                        <div class="img-url">${url.substring(0, 45)}${url.length > 45 ? '…' : ''}</div>
                    </div>
                    <a href="${url}" download="${fileName}" target="_blank" rel="noreferrer" class="dl-link">下载</a>
                </div>
            `;
            resultList.insertAdjacentHTML('beforeend', html);
        });

        log(`已解析 ${urls.length} 条链接，保存路径已应用`);
    }

    /* ── 批量下载 ── */
    async function batchDownload() {
        const links = document.querySelectorAll('.dl-link');
        if (links.length === 0) return alert('请先点击「解析并预览」');

        log(`开始批量触发下载，共 ${links.length} 张...`);
        for (let i = 0; i < links.length; i++) {
            links[i].click();
            log(`已触发第 ${i + 1} 张：${links[i].getAttribute('download').split('/').pop()}`);
            await new Promise(r => setTimeout(r, 1200));
        }
        alert('触发完毕！\n\n✅ Chrome/Edge：文件已保存到指定子文件夹\n⚠️ 若弹出"允许下载多个文件"，请点允许\n📱 手机端：若新页面打开图片，请长按→保存图片');
    }

    // 初始化预览
    updatePreview();
</script>

</body>
</html>
